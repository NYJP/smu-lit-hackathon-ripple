services:
  - type: web
    name: ripple-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: RIPPLE_DATA_DIR
        value: /var/data
      - key: RIPPLE_COOKIE_SECURE
        value: "true"
      - key: RIPPLE_MAX_CONCURRENT_LLM_CALLS
        value: "2"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: RIPPLE_EMBEDDING_MODEL
        sync: false
      - key: RIPPLE_REASONING_MODEL
        sync: false
      - key: RIPPLE_BULK_MODEL
        sync: false
    disk:
      name: ripple-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: ripple-web
    runtime: node
    region: singapore
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: RIPPLE_API_ORIGIN
        fromService:
          type: web
          name: ripple-api
          property: hostport
